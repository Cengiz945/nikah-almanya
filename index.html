:root{

  --navy:#20375A; --red:#B8433A; --teal:#0E7A74; --gold:#A8792A; --plum:#6A4C93; --green:#2E7D4F;
  --ok:#2E7D4F; --ok-soft:#E3F1E8;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10161F; --card:#18212D; --ink:#E8EDF3; --sub:#9AA6B5; --line:#283545; --soft:#1D2734;
  --navy:#9DB7E0; --red:#EE8F86; --teal:#5CC6BF; --gold:#E0B464; --plum:#BFA4EA; --green:#7FD0A0;
  --ok:#7FD0A0; --ok-soft:#173023; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}

/* Kopf */
header{padding:28px 0 8px;display:grid;gap:4px}
.kicker{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:600}
h1{margin:0;font-size:clamp(1.7rem,6.5vw,2.3rem);line-height:1.1;letter-spacing:-.01em;font-weight:750;color:var(--navy)}
h1 small{display:block;font-size:.55em;font-weight:500;color:var(--sub);letter-spacing:0;margin-top:6px}
.overall{display:flex;align-items:center;gap:12px;margin-top:14px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s}
.overall b{font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}

/* Als Nächstes */
.next{margin:20px 0 6px;background:var(--navy);color:var(--bg);border-radius:20px;padding:18px 18px 16px;display:grid;gap:6px;cursor:pointer;border:0;text-align:left;width:100%}
.next .lab{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.next .t{font-size:1.2rem;font-weight:700;line-height:1.25}
.next .d{opacity:.8;font-size:.92rem}
.next .w{font-size:.85rem;opacity:.85;display:flex;gap:6px;align-items:center}
.next .w svg{width:14px;height:14px;flex:none}
@media (prefers-color-scheme: dark){.next{color:#10161F}}

/* Gruppen */
.group{margin-top:26px}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gicon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;font-size:1.3rem}
.gtitle{flex:1;min-width:0}
.gtitle h2{margin:0;font-size:1.15rem;line-height:1.2}
.gtitle p{margin:2px 0 0;color:var(--sub);font-size:.88rem;font-style:italic}
.gcount{font-size:.85rem;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.list{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.row{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 14px 12px}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px;opacity:0}
.item.done .chk{background:var(--ok);border-color:var(--ok)}
.item.done .chk svg{opacity:1}
.txt{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;gap:2px}
.tr{font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.de{color:var(--sub);font-size:.9rem;font-style:italic;line-height:1.3;overflow-wrap:anywhere}
.item.done .tr,.item.done .de{text-decoration:line-through;text-decoration-thickness:1px;opacity:.55}
.where{display:inline-flex;gap:5px;align-items:center;font-size:.78rem;color:var(--sub);margin-top:5px}
.where svg{width:13px;height:13px;flex:none}
.arrow{flex:none;width:20px;height:20px;color:var(--sub);margin-top:6px;transition:transform .2s}
.item.open .arrow{transform:rotate(90deg)}
.flag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);padding:1px 8px;border-radius:99px;margin-top:6px;justify-self:start}

.info{padding:0 16px 16px 54px;display:grid;gap:12px}
.blk{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.blk h4{margin:0;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.blk p{margin:0;font-size:.93rem}
.blk p.de2{color:var(--sub);font-style:italic;font-size:.88rem}
.blk ul{margin:2px 0 0;padding-left:18px;font-size:.93rem}
.blk li{margin:2px 0}
.blk li span{display:block;color:var(--sub);font-style:italic;font-size:.86rem}
.go{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;justify-self:start}
@media (prefers-color-scheme: dark){.go{color:#10161F}}
.kl{list-style:none;padding:0!important}
.kl li{padding:6px 0;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.kl li:first-child{border-top:0;padding-top:0}
.src{display:grid;gap:6px}
.src h4{margin:0;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.src a{font-size:.85rem;overflow-wrap:anywhere}
.sub-h{margin:14px 14px 4px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:700}

/* Fuß */
.foot{margin-top:30px;color:var(--sub);font-size:.82rem;display:grid;gap:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .wrap{display:flex;gap:10px}
.dock button{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:650;cursor:pointer;line-height:1.15}
.dock button.pri{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.dock small{display:block;font-weight:400;font-size:.75rem;opacity:.75}
.stamp{font-size:.8rem;color:var(--sub);text-align:center;margin-top:6px}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,16,25,.5);display:grid;place-items:end center;padding:16px}
.sheet{background:var(--card);border-radius:20px;padding:20px;max-width:520px;width:100%;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet h3{margin:0}
.sheet p{margin:0;color:var(--sub);font-size:.92rem}
.sheet textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft);font:16px/1.4 ui-monospace,Menlo,monospace;color:var(--ink)}
.sheet .btns{display:flex;gap:10px;flex-wrap:wrap}
.sheet .btns button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-weight:600;cursor:pointer}
.sheet .btns .pri{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.dock,.next,.chk svg{display:none}.info{display:grid!important}.item{break-inside:avoid}body{padding:0}}
</style>
</head>

/* ---------- state ---------- */
var SK="nik_v1";
function lsGet(){try{return JSON.parse(localStorage.getItem(SK))||null}catch(e){return null}}
var S=lsGet()||{d:{},sent:0,got:0};
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){toast("Kaydedilemedi · Speichern nicht möglich")}}
function isDone(id){return !!(S.d[id]&&S.d[id][0])}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var ALL=[];G.forEach(function(g){g.items.forEach(function(it){if(it.id){it.g=g;ALL.push(it)}})});

/* ---------- render ---------- */
function render(){
  var h="";
  G.forEach(function(g){
    var its=g.items.filter(function(x){return x.id}),done=its.filter(function(x){return isDone(x.id)}).length;
    h+='<section class="group" id="g-'+g.id+'"><div class="ghead"><div class="gicon" style="background:'+g.color+'" aria-hidden="true">'+g.icon+'</div><div class="gtitle"><h2>'+esc(g.tr)+'</h2><p>'+esc(g.de)+'</p></div><span class="gcount" data-gc="'+g.id+'">'+done+' / '+its.length+'</span></div><div class="list">';
    g.items.forEach(function(it){
      if(it.sub){h+='<div class="sub-h">'+esc(it.sub[0])+' · '+esc(it.sub[1])+'</div>';return}
      var hasInfo=it.info.length||it.docs.length||it.link||it.k.length||it.q.length||(it.wo&&it.wo[0]!=="–");
      h+='<div class="item'+(isDone(it.id)?' done':'')+'" id="i-'+it.id+'">'+
        '<div class="row"><button class="chk" type="button" data-chk="'+it.id+'" aria-label="Erledigt / Tamamlandı" aria-pressed="'+isDone(it.id)+'">'+CHECK+'</button>'+
        '<button class="txt" type="button" data-open="'+it.id+'" aria-expanded="false"><span class="tr">'+esc(it.tr)+'</span><span class="de">'+esc(it.de)+'</span>'+
        (it.wo&&it.wo[0]!=="–"?'<span class="where">'+PIN+esc(it.wo[0])+'</span>':'')+
        (it.flag?'<span class="flag">'+esc(it.flag)+'</span>':'')+'</button>'+(hasInfo?ARROW:'')+'</div>'+
        '<div class="info" hidden>'+
          (it.wo&&it.wo[0]!=="–"&&it.wo[1]!==it.wo[0]?'<p class="de2" style="margin:0;color:var(--sub);font-style:italic;font-size:.88rem">📍 '+esc(it.wo[1])+'</p>':'')+
          (it.docs.length?'<div class="blk"><h4>Belgeler · Unterlagen</h4><ul>'+it.docs.map(function(d){return'<li>'+esc(d[0])+(d[1]!==d[0]?'<span>'+esc(d[1])+'</span>':'')+'</li>'}).join("")+'</ul></div>':'')+
          (it.info.length?'<div class="blk"><h4>Neden · Warum</h4>'+it.info.map(function(x){return'<p>'+esc(x[0])+'</p><p class="de2">'+esc(x[1])+'</p>'}).join("")+'</div>':'')+
          (it.k.length?'<div class="blk"><h4>İletişim · Kontakt</h4><ul class="kl">'+it.k.map(function(x){return'<li>'+linkify(x)+'</li>'}).join("")+'</ul></div>':'')+
          (it.link?'<a class="go" target="_blank" rel="noopener" href="'+esc(it.link)+'">Resmi sayfa · Offizielle Seite ↗</a>':'')+
          (it.q.length?'<div class="src"><h4>Kaynaklar · Quellen</h4>'+it.q.map(function(s){return'<a target="_blank" rel="noopener" href="'+esc(s[1])+'">'+esc(s[0])+' ↗</a>'}).join("")+'</div>':'')+
        '</div></div>';
    });
    h+='</div></section>';
  });
  document.getElementById("groups").innerHTML=h;
  summary();
}
function summary(){
  var n=ALL.length,d=ALL.filter(function(x){return isDone(x.id)}).length,p=Math.round(d*100/n);
  document.getElementById("bar").style.width=p+"%";document.getElementById("pct").textContent=p+" %";
  G.forEach(function(g){var its=g.items.filter(function(x){return x.id});var el=document.querySelector('[data-gc="'+g.id+'"]');if(el)el.textContent=its.filter(function(x){return isDone(x.id)}).length+" / "+its.length});
  var nx=ALL.filter(function(x){return !isDone(x.id)})[0],b=document.getElementById("next");
  if(!nx){b.hidden=true;return}b.hidden=false;b.dataset.go=nx.id;
  document.getElementById("next-tr").textContent=nx.tr;document.getElementById("next-de").textContent=nx.de;
  document.getElementById("next-w").innerHTML=PIN+esc(nx.wo?nx.wo[0]:"");
  var st=document.getElementById("stamp");st.textContent=(S.got?"Son eşitleme · Zuletzt abgeglichen: "+fmt(S.got):"");
}
function linkify(s){
  return esc(s).replace(/([\w.+-]+@[\w-]+\.[\w.-]+)/g,'<a href="mailto:$1">$1</a>')
    .replace(/(\+?\d[\d\s\-]{6,}\d)/g,function(m){return'<a href="tel:'+m.replace(/[\s-]/g,"")+'">'+m+'</a>'})
    .replace(/(^|[\s(:])((?:[a-z0-9-]+\.)+(?:de|com\.tr|gov\.tr|com|tr)(?:\/[\w\-\/.]*)?)/gi,function(m,p,u){return p+'<a target="_blank" rel="noopener" href="https://'+u+'">'+u+'</a>'});
}

  btns.forEach(function(k){var el=document.createElement("button");el.type="button";el.textContent=k.t;if(k.pri)el.className="pri";el.onclick=function(){if(k.fn&&k.fn()===true)return;o.hidden=true};b.appendChild(el)});o.hidden=false}

function b64e(s){var b=new TextEncoder().encode(s),r="";for(var i=0;i<b.length;i++)r+=String.fromCharCode(b[i]);return btoa(r).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}

  return "Nikâh & Almanya – "+n+"/"+ALL.length+" ✓\nUygulamada „Ekle“ye dokun ve bu mesajı yapıştır.\nIn der App auf „Ekle / Einfügen“ tippen und diese Nachricht einfügen.\n\nNIK1:"+b64e(JSON.stringify(p))}

    {t:"Uygula · Übernehmen",pri:true,fn:function(){return apply(document.getElementById("pin").value)}},{t:"Vazgeç · Abbrechen"}]);

function apply(txt){
  var m=/NIK1:([A-Za-z0-9_-]+)/.exec(txt||"");if(!m){toast("Geçerli mesaj yok · Keine gültige Nachricht");return true}
  var p;try{p=JSON.parse(b64d(m[1]))}catch(e){toast("Mesaj bozuk · Nachricht beschädigt");return true}
  if(!p||p.a!=="nik"){toast("Geçerli mesaj yok · Keine gültige Nachricht");return true}
  var n=0;Object.keys(p.d||{}).forEach(function(id){var a=p.d[id],c=S.d[id];if(!ALL.some(function(x){return x.id===id}))return;if(!c||a[1]>c[1]){S.d[id]=[a[0]?1:0,+a[1]||0];n++}});
  S.got=Date.now();save();render();toast(n+" değişiklik alındı · "+n+" Änderungen übernommen");
}
render();
